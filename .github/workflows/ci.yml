name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:

permissions:
  contents: read

# Skeleton checks only. Packing-vector parity (byte-for-byte SmartPy vs TypeScript)
# is added after the payload freeze; that job must not depend on secrets.

jobs:
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  python:
    name: SmartPy / Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest
